<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="60" y="46" width="6" height="34" rx="3" fill="#2563EB"/>
  <text x="80" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="34" font-weight="bold" fill="#1E293B">数据结构①：线性结构</text>
  <text x="80" y="100" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" letter-spacing="1.2" fill="#64748B">LINEAR STRUCTURES · LIST / STACK / QUEUE / STRING</text>
  <line x1="60" y1="120" x2="1220" y2="120" stroke="#E2E8F0" stroke-width="1"/>

  <rect x="60" y="150" width="380" height="486" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M 76 150 h 348 a 16 16 0 0 1 16 16 v 38 h -380 v -38 a 16 16 0 0 1 16 -16 Z" fill="#DBEAFE"/>
  <use data-icon="tabler-outline/stack-2" x="88" y="164" width="24" height="24" fill="#2563EB"/>
  <text x="122" y="183" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#1E40AF">顺序表 vs 链表</text>

  <circle cx="92" cy="240" r="5" fill="#2563EB"/>
  <text x="110" y="246" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#1E293B">顺序表：随机存取</text>
  <text x="110" y="276" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">插入删除平均移动约 n/2 个元素</text>
  <text x="110" y="302" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">时间复杂度 O(n)</text>

  <circle cx="92" cy="350" r="5" fill="#2563EB"/>
  <text x="110" y="356" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#1E293B">单链表：按序号查找 O(n)</text>
  <text x="110" y="386" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">已知前驱时，插入删除仅需改指针</text>
  <text x="110" y="412" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">头插法 / 尾插法建表</text>

  <rect x="88" y="456" width="324" height="146" rx="12" fill="#EFF6FF"/>
  <text x="108" y="486" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#2563EB">怎么选</text>
  <text x="108" y="518" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">查询多、需随机访问 → 顺序表</text>
  <text x="108" y="548" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">频繁插入删除 → 链表</text>
  <text x="108" y="578" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">注意空间开销与缓存友好性</text>

  <rect x="450" y="150" width="380" height="486" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M 466 150 h 348 a 16 16 0 0 1 16 16 v 38 h -380 v -38 a 16 16 0 0 1 16 -16 Z" fill="#CFFAFE"/>
  <use data-icon="tabler-outline/arrows-exchange" x="478" y="164" width="24" height="24" fill="#0891B2"/>
  <text x="512" y="183" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#0F766E">栈与队列</text>

  <circle cx="482" cy="240" r="5" fill="#0891B2"/>
  <text x="500" y="246" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#1E293B">栈：后进先出 LIFO</text>
  <text x="500" y="276" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">顺序栈 / 链栈 / 共享栈</text>

  <circle cx="482" cy="330" r="5" fill="#0891B2"/>
  <text x="500" y="336" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#1E293B">队列：先进先出 FIFO</text>
  <text x="500" y="366" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">循环队列判空判满</text>
  <text x="500" y="392" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">牺牲一个单元 / size / tag</text>

  <rect x="478" y="436" width="324" height="166" rx="12" fill="#F6F9FF"/>
  <text x="498" y="466" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#0891B2">典型应用</text>
  <text x="498" y="498" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">括号匹配 · 表达式求值</text>
  <text x="498" y="528" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">中缀转后缀 · 后缀求值</text>
  <text x="498" y="558" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">递归与函数调用 · 缓冲</text>

  <rect x="840" y="150" width="380" height="486" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M 856 150 h 348 a 16 16 0 0 1 16 16 v 38 h -380 v -38 a 16 16 0 0 1 16 -16 Z" fill="#FEF3C7"/>
  <use data-icon="tabler-outline/search" x="868" y="164" width="24" height="24" fill="#F59E0B"/>
  <text x="902" y="183" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#B45309">串与矩阵</text>

  <circle cx="872" cy="240" r="5" fill="#F59E0B"/>
  <text x="890" y="246" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#1E293B">朴素匹配 O(nm)</text>
  <text x="890" y="276" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">逐字符比较，失配后回溯</text>

  <circle cx="872" cy="330" r="5" fill="#F59E0B"/>
  <text x="890" y="336" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#1E293B">KMP O(n + m)</text>
  <text x="890" y="366" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">next 数组与 nextval 数组</text>
  <text x="890" y="392" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">手算 next 是高频考点</text>

  <rect x="868" y="436" width="324" height="166" rx="12" fill="#FEF3C7"/>
  <text x="888" y="466" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#B45309">压缩存储</text>
  <text x="888" y="498" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">对称 / 三角 / 三对角矩阵</text>
  <text x="888" y="528" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">下标换算公式要熟练</text>
  <text x="888" y="558" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#475569">稀疏矩阵：三元组 / 十字链表</text>

  <text x="60" y="700" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#64748B">2026 考研计算机 408 · 知识点总结</text>
  <text x="1220" y="700" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#64748B">04 / 16</text>
</svg>
